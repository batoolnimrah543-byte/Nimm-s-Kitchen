<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:title" content="Nimm's Kitchen Gallery">
  <meta property="og:description" content="Fresh homemade dishes and comfort food favourites from Nimm's Kitchen.">
  <meta property="og:type" content="website">

  <title>Nimm's Kitchen | Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

</head>
<body data-page="gallery">
  <nav>
    <div class="wrap nav-shell">
      <a class="logo" href="./index.html">Nimm's Kitchen</a>
      <div class="nav-actions">
        <a class="btn alt" href="./index.html#menu">Back to menu</a>
      </div>
    </div>
  </nav>

  <main class="wrap gallery-shell">
    <div class="gallery-header">
      <div class="eyebrow"><svg class="icon" data-lucide="camera"></svg>Fresh food gallery</div>
      <h1 style="font-family: 'Caveat', cursive; font-size: 56px; color: var(--pink); margin-top: 10px;">Explore our dishes</h1>
    </div>

    <div class="gallery-layout">
      <aside class="gallery-list">
        <button class="gallery-card active" type="button" data-image="./assets/images/food-2.jpg" data-title="Signature Khowsey" data-description="A warm, rich and flavour-packed favourite with fresh toppings and bold taste." data-tags="Homemade|Family size|Fresh toppings">
          <img src="./assets/images/food-2.jpg" alt="Signature Khowsey">
          <div>
            <h3>Signature Khowsey</h3>
            <p>Fresh, spicy and comforting.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-3.jpg" data-title="Creamy Pasta Bowl" data-description="Silky Alfredo pasta served with a comforting creamy finish and fresh ingredients." data-tags="Creamy|Comfort food|Chef special">
          <img src="./assets/images/food-3.jpg" alt="Creamy Pasta Bowl">
          <div>
            <h3>Creamy Pasta Bowl</h3>
            <p>Rich and satisfying.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-4.jpg" data-title="Garden Fresh Noodles" data-description="Loaded with vegetables and a tasty noodle base that feels light, fresh and filling." data-tags="Vegetarian|Fresh|Balanced taste">
          <img src="./assets/images/food-4.jpg" alt="Garden Fresh Noodles">
          <div>
            <h3>Garden Fresh Noodles</h3>
            <p>Fresh veggies and hearty noodles.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-5.jpg" data-title="Hot Spice Combo" data-description="A bold combination with a kick of heat and plenty of homemade flavour." data-tags="Spicy|Chef pick|Bold taste">
          <img src="./assets/images/food-5.jpg" alt="Hot Spice Combo">
          <div>
            <h3>Hot Spice Combo</h3>
            <p>Perfect for spice lovers.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-6.jpg" data-title="Golden Crispy Treat" data-description="A crispy and comforting food moment, prepared to feel rich, festive and satisfying." data-tags="Crispy|Comforting|Freshly cooked">
          <img src="./assets/images/food-6.jpg" alt="Golden Crispy Treat">
          <div>
            <h3>Golden Crispy Treat</h3>
            <p>Fresh from the kitchen.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-7.jpg" data-title="Freshly Packed Meal" data-description="A well-balanced meal that looks as good as it tastes, ready to enjoy at home." data-tags="Balanced|Fresh|Ready to enjoy">
          <img src="./assets/images/food-7.jpg" alt="Freshly Packed Meal">
          <div>
            <h3>Freshly Packed Meal</h3>
            <p>Perfect for family gatherings.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-8.jpg" data-title="House Special Bowl" data-description="A beautifully plated dish designed to feel indulgent and homemade at the same time." data-tags="House special|Homemade|Rich flavour">
          <img src="./assets/images/food-8.jpg" alt="House Special Bowl">
          <div>
            <h3>House Special Bowl</h3>
            <p>Comfort and flavour in one bowl.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-9.jpg" data-title="Savory Pasta Delight" data-description="Every bite is rich, creamy and comforting with just the right balance of warmth and taste." data-tags="Savory|Creamy|Comfort food">
          <img src="./assets/images/food-9.jpg" alt="Savory Pasta Delight">
          <div>
            <h3>Savory Pasta Delight</h3>
            <p>Loaded with classic flavour.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-10.jpg" data-title="Homestyle Chicken Plate" data-description="A home-style favorite that brings together warm, familiar flavours and generous portions." data-tags="Homestyle|Chicken|Generous portions">
          <img src="./assets/images/food-10.jpg" alt="Homestyle Chicken Plate">
          <div>
            <h3>Homestyle Chicken Plate</h3>
            <p>Traditional and satisfying.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-11.jpg" data-title="Family Feast Bowl" data-description="A shareable favorite made for gatherings, comfort and celebration." data-tags="Family feast|Shareable|Freshly made">
          <img src="./assets/images/food-11.jpg" alt="Family Feast Bowl">
          <div>
            <h3>Family Feast Bowl</h3>
            <p>Made for group cravings.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-12.jpg" data-title="Freshly Finished Meal" data-description="A colorful, appetizing presentation with rich flavors and clean ingredients." data-tags="Colorful|Fresh|Flavorful">
          <img src="./assets/images/food-12.jpg" alt="Freshly Finished Meal">
          <div>
            <h3>Freshly Finished Meal</h3>
            <p>Beautiful, bold and delicious.</p>
          </div>
        </button>

        <button class="gallery-card" type="button" data-image="./assets/images/food-13.jpg" data-title="Chef's Signature Plate" data-description="A signature dish that brings texture, richness and warmth in every serving." data-tags="Chef special|Signature|Prepared fresh">
          <img src="./assets/images/food-13.jpg" alt="Chef's Signature Plate">
          <div>
            <h3>Chef's Signature Plate</h3>
            <p>Crafted to impress.</p>
          </div>
        </button>
      </aside>

      <div class="gallery-detail">
        <img id="galleryImage" src="./assets/images/food-2.jpg" alt="Signature Khowsey">
        <div class="gallery-info">
          <div class="eyebrow">Favourites</div>
          <h2 id="galleryTitle">Signature Khowsey</h2>
          <p id="galleryDesc">A warm, rich and flavour-packed favourite with fresh toppings and bold taste.</p>
          <ul class="gallery-meta" id="galleryMeta">
            <li>Homemade</li>
            <li>Family size</li>
            <li>Fresh toppings</li>
          </ul>
          <a class="btn" href="./index.html#menu">Order this dish</a>
        </div>
      </div>
    </div>
